# 웹 빌드를 GitHub Pages에 올린다 (docs/DESIGN.md 6장). PR에서는 빌드만 확인한다.
name: 웹 배포

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/deploy-web.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/deploy-web.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 버전 읽기 (.fvmrc)
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: 모델 캐시
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/assets/models/pillbox-*
            frontend/assets/models/*/pillbox-*
          key: model-${{ hashFiles('frontend/assets/models/VERSION', 'frontend/scripts/fetch_model.sh') }}

      - uses: astral-sh/setup-uv@v6
        if: steps.model-cache.outputs.cache-hit != 'true'

      - name: 모델 받기
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/fetch_model.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # ONNX 내보내기에 쓰는 PyTorch는 CPU 버전이면 된다 (CUDA 버전은 몇 GB).
          UV_INDEX: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match

      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      # 사용자 도메인을 쓰면 저장소 variable WEB_BASE_HREF를 /로 둔다. 없으면 github.io/<저장소 이름>/ 아래에 올린다.
      # API_BASE_URL은 맥미니 서버 주소다 (backend/README.md). 비어 있으면 앱이 서버 기능을 숨긴다.
      - run: >-
          flutter build web --release
          --base-href "${{ vars.WEB_BASE_HREF || format('/{0}/', github.event.repository.name) }}"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
