# 웹 빌드를 맥미니에 올린다 (docs/DESIGN.md 6장). PR에서는 빌드만 확인한다.
# 맥미니의 com.pillbbox.web(app/web.py)이 내보내고, Cloudflare Tunnel이 www.<도메인>을 그쪽으로 잇는다.
# 필요한 secrets: MAC_MINI_IP, MAC_MINI_USERNAME, MAC_MINI_SSH_KEY, MAC_MINI_SSH_FINGERPRINT
# 배포 뒤 바깥 주소(www.<도메인>)가 이 커밋의 빌드를 내보내는지 본다 (.github/scripts/smoke.sh).
# main ruleset의 필수 체크(web-build)라서 모든 PR에서 돈다. frontend/를 건드리지 않았으면 빌드와 배포를 건너뛴다.
# on:에 paths를 걸면 워크플로가 아예 돌지 않아 필수 체크가 영영 대기로 남는다.
# 필요한 variables: API_BASE_URL (https://api.<도메인>), WEB_BASE_URL (https://www.<도메인>)
name: 웹 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 손으로 돌리면(workflow_dispatch) 바뀐 게 없어도 빌드하고 배포한다
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/scripts/smoke.sh'

  build:
    name: web-build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 버전 읽기 (.fvmrc)
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: 모델 캐시
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/assets/models/pillbox-*
            frontend/assets/models/*/pillbox-*
          key: model-${{ hashFiles('frontend/assets/models/VERSION', 'frontend/scripts/fetch_model.sh') }}

      - uses: astral-sh/setup-uv@v6
        if: steps.model-cache.outputs.cache-hit != 'true'

      - name: 모델 받기
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/fetch_model.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # ONNX 내보내기에 쓰는 PyTorch는 CPU 버전이면 된다 (CUDA 버전은 몇 GB).
          UV_INDEX: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match

      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      # API_BASE_URL은 맥미니 API 주소다 (backend/README.md). 비어 있으면 앱이 서버 기능을 숨긴다.
      - run: >-
          flutter build web --release --base-href /
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      # 배포 뒤 바깥에서 이 빌드가 나가는지 확인하는 표식 (.github/scripts/smoke.sh)
      - run: echo "${{ github.sha }}" > build/web/commit.txt

      - name: 빌드 묶기
        if: github.event_name != 'pull_request'
        run: tar -czf "$RUNNER_TEMP/web.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web
          path: ${{ runner.temp }}/web.tar.gz
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 배포는 한 번에 하나씩, 들어온 순서대로 한다.
    concurrency:
      group: deploy-web-mac-mini
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web

      - name: 맥미니로 보내기
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.MAC_MINI_IP }}
          username: ${{ secrets.MAC_MINI_USERNAME }}
          key: ${{ secrets.MAC_MINI_SSH_KEY }}
          fingerprint: ${{ secrets.MAC_MINI_SSH_FINGERPRINT }}
          port: 2222
          source: web.tar.gz
          # 홈 폴더 기준
          target: srv/pillbbox-data/incoming

      # releases/<커밋>에 풀고 current를 그쪽으로 바꾼다. 웹 서버는 다시 띄우지 않아도 새 빌드를 내보낸다.
      - name: 새 빌드로 바꾸기
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MAC_MINI_IP }}
          username: ${{ secrets.MAC_MINI_USERNAME }}
          key: ${{ secrets.MAC_MINI_SSH_KEY }}
          fingerprint: ${{ secrets.MAC_MINI_SSH_FINGERPRINT }}
          port: 2222
          script: |
            set -e
            web=~/srv/pillbbox-data/web
            release=$web/releases/${{ github.sha }}
            mkdir -p "$web/releases"
            rm -rf "$release" && mkdir -p "$release"
            tar -xzf ~/srv/pillbbox-data/incoming/web.tar.gz -C "$release"
            rm ~/srv/pillbbox-data/incoming/web.tar.gz
            ln -sfn "$release" "$web/current"
            # 최근 3개만 남긴다. 되돌릴 때는 current를 이전 폴더로 바꾼다
            ls -1dt "$web"/releases/*/ | tail -n +4 | xargs rm -rf
            # 웹 서버(com.pillbbox.web)가 새 빌드를 내보내는지 본다. 아니면 배포를 실패로 끝낸다
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/ || true)
            echo "웹 서버 응답: $code"
            if [ "$code" != 200 ]; then
              echo "웹 서버(com.pillbbox.web)가 200으로 답하지 않습니다. 처음이면 백엔드 배포를 먼저 하세요" >&2
              exit 1
            fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: 바깥에서 확인 (www.<도메인>)
        run: .github/scripts/smoke.sh web "${{ vars.WEB_BASE_URL }}" "${{ github.sha }}"
